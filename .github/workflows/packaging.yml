name: Packaging

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - name: windows-amd64
            runner: windows-latest
            arch: AMD64
          - name: windows-x86
            runner: windows-latest
            arch: x86
          - name: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - name: macos-arm64
            runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: python {project}/.github/scripts/wheel_test.py
          CIBW_SKIP: "*-musllinux*"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  validate_artifacts:
    name: Validate built artifacts
    runs-on: ubuntu-latest
    needs:
      - build_wheels
      - build_sdist
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload consolidated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: dist/*
          if-no-files-found: error

  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate_artifacts
    if: github.event_name == 'release'
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: packaged-artifacts
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

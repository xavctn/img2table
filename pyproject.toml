[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm[simple]>=8",
    "cython>=3.2.4",
    "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "img2table"
dynamic = ["version"]
description = "img2table is a table identification and extraction Python Library for PDF and images, based on OpenCV image processing"
readme = "README.md"
authors = [{ name = "Xavier Canton" }]
license = "MIT"
requires-python = ">=3.11, <3.15"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "pypdfium2>=4.30.0",
    "opencv-contrib-python>=4",
    "beautifulsoup4",
    "xlsxwriter>=3.0.6",
]

[project.urls]
Homepage = "https://github.com/xavctn/img2table"

[project.optional-dependencies]
gcp = ["google-cloud-vision", "requests"]
aws = ["boto3"]
azure = ["azure-cognitiveservices-vision-computervision"]
paddle = ["paddlepaddle", "paddleocr>=3"]
easyocr = ["easyocr>=1.7.0", "pillow>=10.0.1"]
surya = ["surya-ocr>=0.21.1"]
doctr = ["python-doctr"]
rapidocr = ["rapidocr", "onnxruntime"]

[dependency-groups]
dev = [
    "pandas",
    "torch",
    "torchvision",
    "ruff",
    "pytest >= 6",
    "coverage[toml]",
    "pytest-cov",
    "pytest-xdist",
    "openpyxl",
    "sewar",
    "pipdeptree",
    "pyinstrument",
    "jupyter",
    "ipython-autotime",
    "wheel",
    "setuptools-scm",
    "twine",
    "ty>=0.0.19",
    "colordict>=1.2.6",
    "cython>=3.2.4",
]

[tool.uv]
override-dependencies = [
    "opencv-python ; sys_platform == 'never'",
    "opencv-python-headless ; sys_platform == 'never'",
    "opencv-contrib-python-headless ; sys_platform == 'never'",
    "paddleocr>=3.0 ; python_version < '3.14'",
    "paddlepaddle>=3,<3.3 ; python_version < '3.14'",
    "transformers<5",
    "tokenizers>0.13",
    "pillow>=13",
    "virtualenv>=21.14.9",
    "jupyterlab>=4.5.11",
    "tornado>=6.6",
    "filelock>=4.2.1",
]
allow-insecure-host = ["download.pytorch.org"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = [".", "src"]
testpaths = ["tests"]
log_level = "INFO"
python_files = "test_*.py"
filterwarnings = ["ignore::UserWarning"]

[tool.coverage.run]
plugins = ["Cython.Coverage"]
source = ["src"]

[tool.ruff]
exclude = ["**/*.ipynb"]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "PLR2004",
    "PLR0917",
    "SLF001",
    "ANN401",
    "PLC0415",
    "E501",
    "ANN003",
    "PLR0913",
    "S101",
    "S106",
    "D",
    "FBT",
    "COM812",
    "PT011",
    "S301",
    "N806",
    "EM101",
    "EM102",
    "TRY003",
    "TRY300",
    "C901",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.rules]
unused-ignore-comment = "ignore"
import-not-found = "warn"
missing-override-decorator = "ignore"
all = "error"

[tool.ty.environment]
python-version = "3.11"

[tool.uv.audit]
malware-check = true
